name: Deploy Auto Poster Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  PROJECT_DIR: /home/ubuntu/auto-poster-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to server
        run: |
          # Copy files
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='videos/*' \
            --exclude='metadata/*' \
            --exclude='fb_metadata/*' \
            --exclude='ig_metadata/*' \
            ./ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PROJECT_DIR }}/
          
          # Deploy on server
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ env.PROJECT_DIR }}
            
            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            
            # Build and restart
            docker compose build --no-cache
            docker compose up -d
            
            # Cleanup old images
            docker image prune -f
            
            echo "✅ Deploy complete"
            docker compose ps
          ENDSSH

      - name: Notify (optional)
        if: always()
        run: |
          echo "Deployment ${{ job.status }}"